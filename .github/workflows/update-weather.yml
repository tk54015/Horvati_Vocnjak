name: Azuriraj vremenske podatke

on:
  schedule:
    # Svaki dan u 06:15 UTC (08:15 tijekom ljetnog racunanja vremena u Hrvatskoj).
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Dohvati DHMZ podatke
        run: python update_weather.py

      - name: Spremi promjene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || git commit -m "Azuriraj vremenske podatke"
          git push
